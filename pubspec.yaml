name: flutter_boilerplate
description: "A production-ready Flutter boilerplate with clean architecture."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  bloc: ^7.2.1
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  equatable: ^2.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^7.1.0
  flutter_boilerplate_core:
    path: core
  flutter_boilerplate_data:
    path: data
  flutter_boilerplate_domain:
    path: domain
  flutter_screenutil: ^5.9.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  get_it: ^7.6.7
  go_router: ^12.0.0
  hive: ^2.2.0
  hive_flutter: ^1.0.0
  injectable: ^2.1.0
  intl: ^0.18.1
  json_annotation: ^4.9.0
  logger: ^1.4.0
  webview_flutter: ^4.14.1
  pull_to_refresh: ^2.0.0
  retrofit: ">=4.0.0 <4.9.0"
  shared_preferences: ^2.0.0
  shimmer: ^3.0.0

dev_dependencies:
  build_runner: ^2.5.4
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.0.0
  json_serializable: ^6.9.5
  mockito: ^5.4.0
  retrofit_generator: ^9.7.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
